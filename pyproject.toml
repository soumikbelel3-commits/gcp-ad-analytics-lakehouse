[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gcp-ad-analytics-lakehouse"
version = "1.0.0"
description = "Production-grade Medallion Lakehouse on Google Cloud Platform: PySpark, BigQuery, Dataproc, Cloud Composer, Soda Core & Looker Studio"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Soumik Belel", email = "soumikbelel3@gmail.com"}
]
keywords = [
    "data-engineering",
    "gcp",
    "google-cloud",
    "bigquery",
    "pyspark",
    "apache-iceberg",
    "dataproc",
    "cloud-composer",
    "looker-studio",
    "medallion-architecture",
    "adtech",
    "roas",
    "terraform"
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
